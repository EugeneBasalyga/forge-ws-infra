services:
  forge-postgresql:
    # Add concrete latest version tag at the start of project
    image: postgres:18.1
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - forge-pg-data:/var/lib/postgresql

volumes:
  forge-pg-data:
